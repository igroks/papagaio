---
# Papagaio — versão ESPHome.
#
# Substitui o firmware.ino no que vai ficar instalado. O sketch Arduino
# continua no repositório como ferramenta de bancada: é com ele que se
# capturam os códigos de um aparelho novo, e o resultado é transcrito aqui.
#
# Pinos idênticos aos do firmware.ino — mesma fiação, mesma fileira do DevKit.

esphome:
  name: papagaio
  friendly_name: Papagaio

esp32:
  board: esp32dev
  framework:
    type: arduino

logger:
  # O nível padrão despeja todo sinal IR/RF recebido no log, o que é ótimo
  # para aprender códigos novos e barulhento demais para o dia a dia.
  level: INFO

api:
  encryption:
    key: !secret api_encryption_key

ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  # Rede dedicada a IoT, em WPA2-PSK puro.
  #
  # Ela existe por causa da rede anterior, que era mesh em WPA2/WPA3 misto. Lá
  # a placa alternava entre 'Authentication Failed', 'Auth Expired' e
  # 'Association Leave'; o nó repetidor recusava a associação sempre; e mesmo
  # travando o BSSID no roteador só se chegava a ~90% de disponibilidade, com
  # apagões de minutos e reinício espontâneo da placa.
  #
  # O modo de transição WPA2/WPA3 anuncia PMF, e o ESP32 com framework Arduino
  # tropeça nessa negociação. Foi a única hipótese que explicava a
  # erraticidade — às vezes conectava de primeira, às vezes nunca.
  #
  # Hipóteses descartadas por medição, para ninguém tentar de novo:
  #  - roaming entre APs — travar num único BSSID não resolveu
  #  - alimentação — trocar de porta USB, inclusive para um dock
  #    auto-alimentado, não mudou nada: 18/20 antes e depois
  #  - `fast_connect: true` — piorou, trocou as falhas por 'Probe Request
  #    Unsuccessful'/'network can not be found'
  ssid: !secret wifi_ssid
  password: !secret wifi_password

  # O modo de economia do WiFi (padrão `light` no ESP32) desliga o rádio entre
  # beacons, e é a causa clássica de a placa sumir da rede depois de um tempo.
  # Um controle que precisa responder na hora não pode dormir.
  power_save_mode: none

  # Se o WiFi cair, a placa sobe um AP próprio para reconfiguração.
  ap:
    ssid: "Papagaio Fallback"
    password: !secret ap_password

captive_portal:

# TEMPORÁRIO — só para validar o midea_ir contra o ar sem depender do Home
# Assistant. Sobe uma página no IP da placa com os controles das entidades.
# Remover depois do teste: é uma superfície a mais, sem autenticação, num
# aparelho que aciona o portão. Se for mantido, use o bloco `auth:`.
web_server:
  port: 80

# --- Transmissores -----------------------------------------------------------
# Dois barramentos, cada um no seu pino. Diferente do firmware.ino, aqui não
# existe "barramento ativo": os dois funcionam ao mesmo tempo.

remote_transmitter:
  - id: tx_ir
    pin: GPIO19
    # 33% é o duty típico de portadora IR. O carrier_frequency de cada
    # protocolo é definido por quem transmite (o midea_ir usa 38kHz).
    carrier_duty_percent: 33%

  - id: tx_rf
    pin: GPIO21
    # RF 433MHz é OOK puro, sem portadora modulada: duty cheio.
    carrier_duty_percent: 100%

# --- Receptores --------------------------------------------------------------
# Só servem para aprender códigos novos. Depois que tudo estiver mapeado dá
# para comentar este bloco inteiro e liberar os canais RMT.

remote_receiver:
  - id: rx_ir
    pin:
      number: GPIO22
      # A saída do VS1838B é ativa em nível baixo.
      inverted: true
      mode:
        input: true
        pullup: true
    dump: all

  - id: rx_rf
    pin: GPIO23
    dump: rc_switch
    # 433MHz capta muito lixo; estes filtros descartam a maior parte dele.
    tolerance: 50%
    filter: 4us
    idle: 4ms

# --- Ar-condicionado ---------------------------------------------------------
# Entidade de clima de verdade: temperatura, modo e ventilação, e não um
# botão que repete o estado congelado no dia da gravação.
#
# É COOLIX, não midea_ir — apesar de o aparelho ser um Springer Midea. Os dois
# protocolos compartilham os tempos (TICK 560, cabeçalho 4480/4480, 38kHz), o
# que torna fácil confundir, mas a estrutura difere:
#
#   midea_ir: 6 bytes de dados, e o segundo quadro com todos os bits INVERTIDOS
#   coolix:   3 bytes, cada um seguido do seu COMPLEMENTO, e o quadro REPETIDO
#
# A captura do controle real deu `B2 4D 1F E0 A4 5B` duas vezes, idêntico —
# ou seja, payload 24 bits `0xB21FA4` com complementos, quadro repetido. É
# Coolix, e o prefixo 0xB2 é a assinatura da família (veja COOLIX_OFF =
# 0xB27BE0 em coolix.cpp). O midea_ir emitia `A1 A0 45 FF FF 6B`, que o
# aparelho ignorava por ser outra variante.

climate:
  - platform: coolix
    id: ar_cond
    name: "Ar-condicionado"
    transmitter_id: tx_ir
    # Springer só refrigera — sem isso o HA exibiria um modo de aquecimento
    # que o aparelho ignora.
    supports_heat: false

# --- Portão ------------------------------------------------------------------
# Código fixo, confirmado na prática.
#
# É um `button`, e não um `cover`, de propósito: o motor alterna a direção
# sozinho e o mesmo código abre e fecha, então nada no rádio diz se o portão
# está aberto. Um `cover` teria semântica melhor para assistentes de voz (e
# exigiria PIN, por causa do device_class garage), mas exibiria um estado que
# é chute — e estado errado numa porta de garagem é pior que estado nenhum.
# Resolver isso depende de sensor físico (reed switch na posição fechado),
# provavelmente num segundo ESP32 junto ao portão. Adiado conscientemente.
#
# ATENÇÃO: o código do portão NÃO vai neste arquivo. Como o controle é de
# código fixo, esse número é a credencial inteira do acesso — não há contador
# nem desafio-resposta por trás dele. Quem tiver o valor abre o portão com um
# transmissor de 433MHz qualquer. Este repositório é público, e git guarda
# histórico para sempre; por isso o valor mora no secrets.yaml, que é ignorado
# pelo git. Códigos de IR (ar, TV) não têm esse problema e podem ficar aqui.

button:
  - platform: template
    name: "Portão"
    icon: mdi:garage
    on_press:
      - remote_transmitter.transmit_rc_switch_raw:
          transmitter_id: tx_rf
          code: !secret portao_code
          # Protocolo 6 da rc-switch (HT6P20B), mas com o pulso medido no
          # controle real em vez do nominal de 450us: o oscilador do HT6P20B é
          # ajustado por resistor externo, então cada unidade tem o seu valor,
          # e este controle transmite consistentemente a ~506us. As proporções
          # e o `inverted` vêm da tabela da rc-switch (RCSwitch.cpp:87).
          # Se não funcionar, o teste seguinte é trocar tudo isso por
          # `protocol: 6` e deixar o ESPHome usar o nominal.
          protocol:
            pulse_length: 506
            sync: [23, 1]
            zero: [1, 2]
            one: [2, 1]
            inverted: true
